[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-browser"
version = "0.1.0"
description = "Small BrowserGym loop for intent-preserving browser experiments"
requires-python = ">=3.11,<3.14"
dependencies = ["browsergym-core==0.14.3", "httpx>=0.27,<1", "Pillow>=10", "python-dotenv>=1,<2", "jsonschema>=4.18,<5", "tokenizers==0.23.2", "greenlet>=3,<4"]

[project.optional-dependencies]
miniwob = ["browsergym-miniwob==0.14.3"]
dev = ["pytest>=8,<10"]
context = ["tokenizers==0.23.2"]

[project.scripts]
intent-browser = "intent_browser.cli:main"

[tool.setuptools.packages.find]
include = ["intent_browser*"]
