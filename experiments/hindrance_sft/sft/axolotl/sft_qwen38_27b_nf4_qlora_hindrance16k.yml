# Derived from training/configs/sft_qwen38_27b_nf4_qlora.yml (baseline unchanged otherwise).
# Changes: dataset = hindrance self-distillation 16k windows; message_field_training: training
# (REQUIRED: window rows mark history assistant turns training:false, so each turn gets loss once);
# field_tools: tools (native tool schema rendered into the system turn, as at inference);
# enable_thinking: true (same as run_sft.py --enable-thinking); sequence_len 16384.
# On the GPU host, replace the absolute dataset path or pass --dataset.
base_model: greghavens/Qwen3.8-27B-bnb-4bit
revision_of_model: 26157380225e427827263c34df23018a1e28dff5
plugins:
- browser_training.axolotl_plugin.PrecisionPlugin
strict: false
chat_template: tokenizer_default
chat_template_kwargs:
  enable_thinking: true
  preserve_thinking: true
datasets:
- path: /home/bjorn/code/LLM_proj_uu/.local/coordination/demo-sprint/sft/data/train.qwen.primary16k.jsonl
  type: chat_template
  field_messages: messages
  field_tools: tools
  message_field_training: training
  roles_to_train:
  - assistant
  train_on_eos: turn
val_set_size: 0.0
output_dir: outputs/sft-qwen38-nf4-hindrance16k
dataset_prepared_path: data/prepared-qwen38-nf4-hindrance16k
sequence_len: 16384
sample_packing: false
adapter: qlora
load_in_4bit: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
peft_autocast_adapter_dtype: false
lora_target_modules:
- self_attn.q_proj
- self_attn.k_proj
- self_attn.v_proj
- self_attn.o_proj
- mlp.gate_proj
- mlp.up_proj
- mlp.down_proj
- linear_attn.in_proj_qkv
- linear_attn.in_proj_z
- linear_attn.out_proj
lora_mlp_kernel: false
lora_qkv_kernel: false
lora_o_kernel: false
train_on_inputs: false
micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 1
learning_rate: 0.0001
weight_decay: 0.0
lr_scheduler: cosine
warmup_ratio: 0.03
optimizer: adamw_torch
bf16: true
fp8: false
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: sdpa
logging_steps: 1
save_steps: 50
save_total_limit: 3
seed: 42
resume_from_checkpoint: null
