[project]
name = "browser-sft-stack"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "axolotl==0.19.0", "torch==2.13.0", "torchvision==0.28.0",
  "transformers==5.16.1", "peft==0.20.0", "accelerate==1.13.0",
  "flash-linear-attention==0.5.2", "bitsandbytes==0.50.2",
]

[project.optional-dependencies]
packing = ["flash-attn==2.8.3"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops"]
