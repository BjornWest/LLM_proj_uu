[project]
name = "browser-rl-stack"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "trl", "vllm==0.28.0", "torch==2.13.0", "torchvision==0.28.0",
  "transformers==5.16.1", "peft==0.20.0", "accelerate==1.13.0",
  "flash-linear-attention==0.5.2", "kernels==0.16.0",
  "openenv==0.4.2", "bitsandbytes==0.50.2", "PyYAML==6.0.3",
]

[project.optional-dependencies]
sm120 = ["flash-attn==2.8.3"]

[tool.uv.sources]
trl = { url = "https://github.com/huggingface/trl/archive/a04ffd337108285002df29d9ae73ef7e855e03f1.tar.gz" }

[tool.uv]
constraint-dependencies = ["nvidia-cuda-nvcc==13.0.88", "nvidia-cuda-crt==13.0.88", "nvidia-cuda-cccl==13.0.85", "nvidia-nvvm==13.0.88"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops"]
