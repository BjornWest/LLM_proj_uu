base_model: Qwen/Qwen3-0.6B
revision_of_model: c1899de289a04d12100db370d81485cdf75e47ca
plugins:
  - browser_training.axolotl_plugin.PrecisionPlugin
strict: false
chat_template: tokenizer_default
datasets:
  - path: data/smoke.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train: [assistant]
    train_on_eos: turn
val_set_size: 0.0
output_dir: outputs/sft-smoke
dataset_prepared_path: data/prepared-smoke
sequence_len: 256
sample_packing: false
adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
peft_autocast_adapter_dtype: false
lora_target_modules: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
train_on_inputs: false
micro_batch_size: 1
gradient_accumulation_steps: 1
max_steps: 3
learning_rate: 0.0001
weight_decay: 0.0
optimizer: adamw_torch
bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
attn_implementation: sdpa
logging_steps: 1
save_steps: 1
save_total_limit: 2
seed: 42
resume_from_checkpoint:
