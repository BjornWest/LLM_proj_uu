# Remote candidate: Axolotl's fused LoRA path dequantizes FP8 blocks for BF16
# matmuls/autograd. This is FP8 STORAGE, not FP8 training compute. See NOTES.md.
base_model: Qwen/Qwen3.8-27B-FP8
revision_of_model: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
plugins:
  - browser_training.axolotl_plugin.PrecisionPlugin
strict: false
chat_template: tokenizer_default
chat_template_kwargs:
  enable_thinking: false
  preserve_thinking: true
datasets:
  - path: data/sft.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train: [assistant]
    train_on_eos: turn
val_set_size: 0.0
output_dir: outputs/sft-qwen38-fp8
dataset_prepared_path: data/prepared-qwen38
sequence_len: 2048
# The packing patch also wires the DeltaNet fused LoRA projections.
# Requires the optional packing environment (FlashAttention 2 + FLA).
sample_packing: true
adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
peft_autocast_adapter_dtype: false
# Qualified suffixes exclude vision, embeddings, lm_head and MTP.
# DeltaNet a/b, convolution, decay and norms remain frozen.
lora_target_modules:
  - self_attn.q_proj
  - self_attn.k_proj
  - self_attn.v_proj
  - self_attn.o_proj
  - mlp.gate_proj
  - mlp.up_proj
  - mlp.down_proj
  - linear_attn.in_proj_qkv
  - linear_attn.in_proj_z
  - linear_attn.out_proj
lora_mlp_kernel: true
lora_qkv_kernel: true
lora_o_kernel: true
train_on_inputs: false
micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 1
learning_rate: 0.0001
weight_decay: 0.0
lr_scheduler: cosine
warmup_ratio: 0.03
optimizer: adamw_torch
# Plugin supplies bitsandbytes AdamW32bit with FP32 moments.
bf16: true
fp8: false
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: flash_attention_2
logging_steps: 1
save_steps: 50
save_total_limit: 3
seed: 42
resume_from_checkpoint:
