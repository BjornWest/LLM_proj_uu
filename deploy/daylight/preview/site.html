<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sample website</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui;color:#233b38;background:#fafbf8}header{padding:22px 48px;display:flex;align-items:center;gap:30px;border-bottom:1px solid #dce4d8;background:#fff}header strong{font-size:22px;letter-spacing:-.8px;margin-right:auto}a{color:inherit}header a{font-size:12px;text-decoration:none}.tag{font-size:10px;background:#edf1e7;border-radius:5px;padding:5px 8px}.hero{padding:40px 48px;background:#eaf0e2}small{letter-spacing:2px;text-transform:uppercase;font-size:10px;color:#6f816a}h1{font-size:33px;line-height:1.2;letter-spacing:-1px;margin:10px 0}p{color:#6d7b69;font-size:13px}main{padding:25px 48px}.filters{display:flex;gap:15px;margin-bottom:24px;align-items:end}label{font-size:11px;display:block}input,select{padding:9px;border:1px solid #d5ddce;border-radius:6px;background:white;font:12px system-ui;color:inherit}button{background:#2b654c;color:white;border:0;border-radius:6px;padding:10px 18px;cursor:pointer;font:12px system-ui}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid #dde4d7;border-radius:9px;background:white;overflow:hidden}.art{height:130px;background:#dce5d2;display:grid;place-items:center}.room{width:110px;height:65px;border:7px solid #87a078;background:#eff4e9;box-shadow:12px 10px 0 #bdceb2}.room:after{content:'';display:block;margin:15px auto;background:#a5b88e;width:50px;height:25px;border-radius:3px}.body{padding:17px}h2{font-size:16px;margin:0 0 5px}.body p{font-size:11px;margin:4px 0 14px}.price{float:right}.book{height:105px;width:76px;background:#344f44;color:#f0e3b8;border-left:7px solid #263e34;border-radius:2px 5px 5px 2px;box-shadow:7px 7px 0 #00000015;text-align:center;display:grid;place-items:center;padding:8px;font:12px Georgia}.bookshop{background:#faf7f0;color:#493e32}.bookshop .hero{background:#eee5d3}.bookshop .art{background:#eee8d9}.bookshop button{background:#675541}.bookshop small,.bookshop p{color:#87795e}#result{padding:16px;background:#f0f4e9;border:1px solid #d6e2c8;border-radius:8px;margin-bottom:18px;font-size:13px}footer{padding:16px 48px;font-size:10px;color:#7d8879} @media(max-width:650px){header,.hero,main,footer{padding:20px}.grid{grid-template-columns:1fr}.filters{flex-wrap:wrap}}
</style></head><body><header><strong id="brand">Campus</strong><a href="?site=rooms">Study rooms</a><a href="?site=sample-bookshop">Bookshop</a><span class="tag">Fictional UX sample</span></header><section class="hero"><small id="kicker">Space to think</small><h1 id="headline">Find your next study spot.</h1><p id="subhead">A quiet corner for a focused afternoon, or room for the whole group.</p></section><main><div class="filters"><label id="filter-label">Building<br><select><option>Ångström</option><option>Carolina</option></select></label><label id="second-label">Day<br><select><option>Tuesday</option><option>Wednesday</option></select></label><label id="third-label">People<br><select><option>3 people</option><option>4 people</option></select></label><button id="search">Find a room</button></div><div id="result" hidden></div><div class="grid" id="cards"></div></main><footer>Sample website for the Daylight UX preview. No real bookings, purchases or agent runs.</footer><script>
const params=new URLSearchParams(location.search), shop=params.get('site')==='sample-bookshop', step=Number(params.get('step')||0), $=id=>document.getElementById(id);
if(shop){document.body.classList.add('bookshop');$('brand').textContent='Fieldnotes';$('kicker').textContent='Books for a slower afternoon';$('headline').textContent='Find something worth noticing.';$('subhead').textContent='Field guides, quiet stories and ideas to take outside.';$('filter-label').innerHTML='Search the shelves<br><input placeholder="Title or author" value="'+(step>0?'A Field Guide to Noticing':'')+'">';$('second-label').innerHTML='Format<br><select><option>Paperback</option><option>Hardback</option></select>';$('third-label').innerHTML='Price<br><select><option>Under 200 SEK</option><option>All prices</option></select>';$('search').textContent='Find a book';}
const titles=shop?['A Field Guide to Noticing','The Art of Wandering','Small Gardens']:['Ångström · Room A101','Ångström · Room A204','Ångström · Room B112'];
$('cards').innerHTML=titles.map((title,i)=>'<article class="card"><div class="art">'+(shop?'<div class="book" style="background:'+['#344f44','#946e45','#5d7081'][i]+'">'+title+'</div>':'<div class="room"></div>')+'</div><div class="body"><h2>'+title+'</h2><p>'+(shop?'Paperback · In stock':'Tuesday · '+['13:00–13:30','14:00–14:30','15:00–15:30'][i]+' · 4 seats')+'</p><span class="price">'+(shop?[179,149,189][i]+' SEK':'Available')+'</span><button class="choose">'+(shop?'View book':'View room')+'</button></div></article>').join('');
function detail(){ $('result').hidden=false;$('result').textContent=shop?'A Field Guide to Noticing · Paperback · 179 SEK. Gift wrapping and membership are optional. This sample has no checkout.':'Ångström A101 · Tuesday, 13:00–13:30 · Fits 3 people. This sample has no reservation service.'; }
$('search').onclick=()=>{$('result').hidden=false;$('result').textContent='3 sample results. Choose one to inspect the details.';};document.querySelectorAll('.choose').forEach(b=>b.onclick=detail);if(step>=2)detail();
</script></body></html>
