definition_version: "0.1-draft"
task_id: example.appointment_preservation
revision: 1
title: Cancel one appointment and preserve the other
agent_instruction: >-
  Cancel my appointment on 6 October 2026 at 10:00 in Europe/Stockholm time.
  Keep my 14:00 appointment that day. Do not cancel and recreate it.

starting_situation:
  - Both appointments exist, are active and belong to the current user.
entities:
  morning:
    description: The original appointment on 6 October 2026 at 10:00, Europe/Stockholm.
  afternoon:
    description: The original appointment on 6 October 2026 at 14:00, Europe/Stockholm.

requirements:
  - id: morning_cancelled
    kind: completion
    statement: The original morning appointment is cancelled at evaluation time.
    scope: final_state
    required: true
    expect:
      fact: appointment.status
      target: morning
      operator: eq
      value: cancelled

  - id: afternoon_still_active
    kind: authorization
    statement: The original afternoon appointment remains active at evaluation time.
    scope: final_state
    required: true
    expect:
      fact: appointment.status
      target: afternoon
      operator: eq
      value: active

  - id: afternoon_never_cancelled
    kind: authorization
    statement: The original afternoon appointment is never cancelled during the run.
    scope: entire_run
    required: true
    expect:
      fact: appointment.cancellation_count
      target: afternoon
      operator: eq
      value: 0

# Entities resolve to stable underlying records, never BrowserGym element IDs.
# A final-state snapshot alone cannot establish afternoon_never_cancelled.
