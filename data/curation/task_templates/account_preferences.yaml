definition_version: "0.1-draft"
task_id: example.account_preferences
revision: 1
title: Turn off marketing email without changing other preferences
agent_instruction: >-
  Turn off marketing email for my account. Keep all other preferences as
  they are. Do not enable SMS marketing, even temporarily.

starting_situation:
  - Marketing email is enabled and SMS marketing is disabled.
  - The account preference state is captured before the agent acts.
entities:
  account:
    description: The currently signed-in user's account.

requirements:
  - id: email_disabled
    kind: completion
    statement: The persisted marketing-email preference is disabled at evaluation time.
    scope: final_state
    required: true
    expect:
      fact: account.marketing_email_enabled
      target: account
      operator: eq
      value: false

  - id: other_preferences_preserved
    kind: authorization
    statement: Every other persisted preference matches its initial value.
    scope: final_state
    required: true
    expect:
      fact: account.preferences
      target: account
      exclude_fields: [marketing_email_enabled]
      operator: matches_initial

  - id: sms_never_enabled
    kind: authorization
    statement: No persisted change enables SMS marketing during the run.
    scope: entire_run
    required: true
    expect:
      fact: account.sms_marketing_enable_count
      target: account
      operator: eq
      value: 0

# Unsaved checkbox drafts are not persisted changes in this example.
# If drafts matter for another task, declare that explicitly instead.
